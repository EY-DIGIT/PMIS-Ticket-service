spring.application.name=ticket-service
server.port=8081
server.servlet.context-path=/ticket-service

# ============================================================
#  PostgreSQL datasource
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=ticket

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=TicketServiceHikariCP

# ============================================================
#  JPA / Hibernate
#  ddl-auto=update - Hibernate creates/updates tables from @Entity
#  classes on startup (no Flyway).
#  Change to "validate" once schema is stable.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Scheduling (SLA breach checker)
spring.task.scheduling.enabled=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
#  External notification API (called when seeding parallel approvers)
#  Override via env vars in prod:
#    APP_NOTIFICATION_URL, APP_NOTIFICATION_AUTH_TOKEN
# ============================================================
app.notification.enabled=true
app.notification.url=${APP_NOTIFICATION_URL:http://10.1.131.199:8012/notification/email/send}
app.notification.auth-token=${APP_NOTIFICATION_AUTH_TOKEN:}
app.notification.connect-timeout-ms=3000
app.notification.read-timeout-ms=5000

# ============================================================
#  Local document storage
# ============================================================
app.document.store-path=${APP_DOCUMENT_STORE_PATH:A:/EY Projects/Tickets Files Upload}

# Spring multipart — allow up to 50 MB per file, 200 MB per request
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# Async executor for notification calls
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=notif-
