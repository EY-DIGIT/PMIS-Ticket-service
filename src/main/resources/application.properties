spring.application.name=ticket-service
server.port=8081
server.servlet.context-path=/ticket-service

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pmis}
spring.datasource.username=${DB_USER:pmis}
spring.datasource.password=${DB_PASS:pmis}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Scheduling (SLA breach checker)
spring.task.scheduling.enabled=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
